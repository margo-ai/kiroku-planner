server {
    listen 80; # Слушаем порт 80 (HTTP)
    server_name _; # Любой домен (wildcard)
    root /usr/share/nginx/html; # Корневая директория со статикой
    index index.html; # Файл по умолчанию

    # Главное правило — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Пытается найти файл как есть ($uri → /tasks.html)
        # Потом как папку ($uri/ → /tasks/)
        # Если ничего нет → отдаёт /index.html (React сам покажет /tasks)
    }

    # Статика кешируется на год
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}